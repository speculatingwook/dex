<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b2e"/>
      <stop offset="100%" stop-color="#0f1019"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#5b7ee5"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9ece6a"/>
      <stop offset="100%" stop-color="#73b83e"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="40" y="40" width="944" height="944" rx="200" ry="200" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="40" y="40" width="944" height="944" rx="200" ry="200" fill="none" stroke="#2a2b3d" stroke-width="3"/>

  <!-- Divider line (split panel) -->
  <line x1="512" y1="180" x2="512" y2="844" stroke="#3b3d56" stroke-width="3"/>

  <!-- LEFT SIDE: Document -->
  <!-- Doc lines -->
  <rect x="160" y="260" width="220" height="14" rx="7" fill="#7aa2f7" opacity="0.9"/>
  <rect x="160" y="310" width="260" height="10" rx="5" fill="#565876" opacity="0.6"/>
  <rect x="160" y="340" width="240" height="10" rx="5" fill="#565876" opacity="0.6"/>
  <rect x="160" y="370" width="200" height="10" rx="5" fill="#565876" opacity="0.6"/>
  <rect x="160" y="400" width="250" height="10" rx="5" fill="#565876" opacity="0.6"/>

  <rect x="160" y="450" width="180" height="14" rx="7" fill="#7aa2f7" opacity="0.7"/>
  <rect x="160" y="500" width="270" height="10" rx="5" fill="#565876" opacity="0.6"/>
  <rect x="160" y="530" width="230" height="10" rx="5" fill="#565876" opacity="0.6"/>
  <rect x="160" y="560" width="260" height="10" rx="5" fill="#565876" opacity="0.6"/>
  <rect x="160" y="590" width="190" height="10" rx="5" fill="#565876" opacity="0.6"/>

  <rect x="160" y="640" width="210" height="14" rx="7" fill="#7aa2f7" opacity="0.5"/>
  <rect x="160" y="690" width="250" height="10" rx="5" fill="#565876" opacity="0.6"/>
  <rect x="160" y="720" width="220" height="10" rx="5" fill="#565876" opacity="0.6"/>

  <!-- RIGHT SIDE: Terminal -->
  <!-- Terminal prompt -->
  <text x="570" y="290" font-family="Menlo, Monaco, monospace" font-size="42" font-weight="bold" fill="#9ece6a">$</text>
  <rect x="620" y="264" width="200" height="12" rx="6" fill="#a9b1d6" opacity="0.5"/>

  <!-- Terminal output lines -->
  <rect x="570" y="330" width="280" height="10" rx="5" fill="#565876" opacity="0.5"/>
  <rect x="570" y="360" width="240" height="10" rx="5" fill="#565876" opacity="0.5"/>
  <rect x="570" y="390" width="260" height="10" rx="5" fill="#565876" opacity="0.5"/>

  <!-- Active prompt with cursor -->
  <text x="570" y="470" font-family="Menlo, Monaco, monospace" font-size="42" font-weight="bold" fill="#9ece6a">$</text>
  <rect x="620" y="448" width="150" height="12" rx="6" fill="#a9b1d6" opacity="0.5"/>
  
  <!-- Blinking cursor -->
  <rect x="785" y="444" width="12" height="24" rx="2" fill="#c0caf5" opacity="0.9"/>

  <!-- More output -->
  <rect x="570" y="510" width="290" height="10" rx="5" fill="#7aa2f7" opacity="0.4"/>
  <rect x="570" y="540" width="250" height="10" rx="5" fill="#9ece6a" opacity="0.4"/>
  <rect x="570" y="570" width="270" height="10" rx="5" fill="#565876" opacity="0.5"/>

  <!-- Bottom prompt -->
  <text x="570" y="650" font-family="Menlo, Monaco, monospace" font-size="42" font-weight="bold" fill="#9ece6a">$</text>
  <rect x="622" y="632" width="3" height="22" rx="1" fill="#c0caf5" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>